<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHN KCP FAQ</title>
<meta name="description" content="궁금한 내용을 문장으로 질문하면 NHN KCP FAQ와 매뉴얼에서 찾아 정리해 드립니다.">
<style>
:root {
  --ink: #191919;
  --ink-2: #2E2E2E;
  --muted: #5C5C5C;
  --line: #E0E0E0;
  --line-strong: #CACACA;
  --bg: #F6F6F6;
  --surface: #FFFFFF;
  --blue: #2196F3;
  --blue-dim: #1a78c2;
  --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F2F2;
    --ink-2: #E0E0E0;
    --muted: #B5B5B5;
    --line: #3A3A3A;
    --line-strong: #555555;
    --bg: #191919;
    --surface: #242424;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }

h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; }
.lead { margin: 0 0 22px; color: var(--muted); font-size: 15.5px; }

/* 검색 */
.search { display: flex; gap: 8px; }
.search input[type="search"] {
  flex: 1; min-width: 0; height: 56px; padding: 0 18px;
  font: inherit; font-size: 17px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  -webkit-appearance: none; appearance: none;
}
.search input[type="search"]::placeholder { color: var(--muted); opacity: .8; }
.search input[type="search"]:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
.search button {
  flex: none; height: 56px; padding: 0 22px; font: inherit; font-weight: 700; font-size: 16px;
  color: #191919; background: var(--blue); border: 0; border-radius: 8px; cursor: pointer;
}
.search button:hover { background: var(--blue-dim); }
.search button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 안내문 */
.notice-small { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }

/* 장비 선택 */
.pick { margin: 14px 0 0; }
.pick-card { background: var(--surface); border: 1px solid var(--line-strong); border-left: 3px solid var(--blue); border-radius: 8px; padding: 16px 18px; }
.pick-card p { margin: 0 0 10px; font-size: 15px; }
.pick-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-btn {
  font: inherit; text-align: left; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 14px; cursor: pointer; line-height: 1.35;
}
.pick-note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 8px; padding: 12px 16px; font-size: 14.5px; color: var(--ink-2); }
.pick-note strong { color: var(--ink); }
.pick-btn b { display: block; font-size: 15.5px; }
.pick-btn span { display: block; font-size: 12.5px; color: var(--muted); }
.pick-btn:hover { border-color: var(--blue); }
.pick-btn:focus-visible, .pick-skip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.pick-skip { margin-top: 10px; font: inherit; font-size: 13.5px; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* AI 대기 표시 */
.ai-loading { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; }
.spinner { flex: none; width: 18px; height: 18px; border: 2px solid var(--line-strong); border-top-color: var(--blue); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 상태 줄 */
.status { margin: 18px 0 10px; min-height: 22px; font-size: 14px; color: var(--muted); }
.status strong { color: var(--ink); font-weight: 700; }
.cond { display: block; margin-top: 2px; }

/* 결과 목록 */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.q {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: transparent; border: 0; padding: 16px 18px 16px 18px; cursor: pointer;
  border-left: 3px solid transparent;
}
.q:hover { background: rgba(127,127,127,.07); }
.q:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.q[aria-expanded="true"] { border-left-color: var(--blue); }
.q-title { display: block; font-size: 16.5px; font-weight: 600; line-height: 1.5; letter-spacing: -0.005em; }
.q-title mark { background: rgba(33,150,243,.22); color: inherit; border-radius: 2px; padding: 0 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.a { padding: 0 18px 20px 21px; border-left: 3px solid var(--blue); }
.a[hidden] { display: none; }
.a-body { max-width: 68ch; margin: 0; font-size: 15.5px; line-height: 1.8; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.a-body a { color: var(--blue-dim); text-decoration: underline; text-underline-offset: 2px; }
.a-meta { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.a-link { margin: 10px 0 0; font-size: 14px; }
.a-link a { color: var(--blue-dim); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.a-link a:hover { color: var(--ink); }
.a-link a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* 빈 결과·오류 */
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px 20px; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; color: var(--muted); font-size: 14.5px; }
.docs-wrap { margin-top: 26px; }
.docs-wrap h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.docs-wrap .docs-sub { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.ai-wrap { margin: 14px 0 14px; }
.ai-btn {
  font: inherit; font-size: 15px; font-weight: 700; color: #191919; background: var(--blue);
  border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
}
.ai-btn:hover { background: var(--blue-dim); }
.ai-btn:disabled { opacity: .5; cursor: default; }
.ai-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ai-hint { margin: 6px 2px 0; font-size: 13px; color: var(--muted); }
.ai-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.ai-card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
.ai-body { max-width: 68ch; margin: 0; font-size: 15.5px; line-height: 1.8; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.ai-body strong { font-weight: 700; color: var(--ink); }
.more { padding: 12px 18px; text-align: center; }
.more button {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 18px; cursor: pointer;
}
.more button:hover { border-color: var(--blue); }
.more button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.ai-note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.ai-msg { margin: 0; font-size: 14.5px; color: var(--muted); }
.feedback { margin: 14px 2px 0; font-size: 14px; color: var(--muted); }
.feedback button {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 14px; margin-left: 8px; cursor: pointer;
}
.feedback button:hover { border-color: var(--blue); }
.feedback button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.privacy { margin-top: 6px; font-size: 13px; color: var(--muted); }
.contact { margin-top: 28px; font-size: 14px; color: var(--muted); }
.contact strong { color: var(--ink); }
.updated { margin-top: 6px; font-size: 13px; color: var(--muted); }

@media (max-width: 520px) {
  .wrap { padding: 24px 14px 56px; }
  h1 { font-size: 24px; }
  .search button { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } .spinner { animation: none; } }
</style>

<body>
<main class="wrap">
  <h1>NHN KCP FAQ</h1>
  <p class="lead">궁금한 내용을 문장으로 물어보세요. 제품명이나 오류 문구를 함께 쓰면 더 정확합니다.</p>

  <form class="search" id="form" role="search" autocomplete="off">
    <input type="search" id="q" aria-label="질문 입력" placeholder="예: C3100 영수증 다시 뽑는 법" enterkeyhint="search">
    <button type="submit" id="go">질문하기</button>
  </form>
  <p class="notice-small" id="aiNotice" hidden>질문 내용은 AI 요약과 FAQ 개선에 쓰이도록 익명으로 기록됩니다. 가맹점 정보나 연락처 같은 개인정보는 입력하지 마세요.</p>

  <div class="pick" id="pick" hidden></div>
  <div class="ai-wrap" id="ai" aria-live="polite"></div>

  <p class="contact">원하는 답이 없으면 <strong>NHN KCP 운영팀 1688-9770</strong>으로 문의해 주세요.</p>
  <p class="updated" id="updated"></p>
</main>

<script id="core">
/* =========================================================
   검색 핵심 로직 (화면과 분리되어 있음)
   ========================================================= */

/* ▼ 동의어 사전: 현장에서 쓰는 표현을 묶어 둔 곳입니다.
     같은 줄(묶음)에 있는 말은 서로 같은 뜻으로 검색됩니다.
     새 표현은 줄을 추가하거나 기존 줄에 따옴표로 단어를 더하면 됩니다. */
const SYNONYM_GROUPS = [
  ["영수증", "전표", "매출전표", "거래전표", "출력물"],
  ["재출력", "재인쇄", "다시출력", "재발행", "재프린트", "다시뽑", "재프린팅"],
  ["취소", "환불", "승인취소", "결제취소", "거래취소"],
  ["전원", "안켜", "안켜져", "켜지지", "부팅", "먹통", "꺼짐", "꺼져"],
  ["프린터", "프린트", "용지", "종이"],
  ["오류", "에러", "장애", "실패", "error"],
  ["위챗", "위챗페이", "wechat", "wechatpay", "위쳇"],
  ["토스", "토스페이", "tosspay"],
  ["프론트", "front", "토스프론트", "tossfront"],
  ["네이버", "naver", "네이버페이", "npay", "엔페이", "n페이", "페이센터"],
  ["커넥트", "connect"],
  ["개통", "개통번호", "개통확인"],
  ["비밀번호", "비번", "패스워드", "암호"],
  ["키오스크", "무인결제", "셀프결제", "무인"],
  ["집계", "마감", "일마감", "호스트집계"],
  ["한도", "고액", "보류", "매입"],
  ["해외카드", "외국카드", "해외발급", "해외"],
  ["전화승인", "ars", "수기승인"],
  ["가맹점번호", "가맹점", "mid"],
  ["설정", "세팅", "셋팅", "환경설정"],
  ["지원기종", "지원단말기", "가능단말기", "되는기계", "되는단말기", "사용가능단말기"],
  ["as번호", "a/s번호", "에이에스", "서비스센터", "수리", "고장", "수리점", "as연락처", "연락처"]
];

/* ▼ 단말기 종류 사전: 모델명을 말하면 그 단말기가 어떤 종류인지 함께 검색합니다.
     왼쪽은 모델명(영문 대문자·숫자만, 예: SCS-4200 → SCS4200), 오른쪽은 FAQ에 적힌 종류 표현입니다.
     새 모델은 한 줄을 추가하면 됩니다. */
const MODEL_ALIASES = {
  // 대부분의 모델은 노션 "제품 제조사 / A/S 연락처" 표의 제품 구분에서 자동으로 만들어집니다.
  // 표에 없는 모델만 예시처럼 한 줄씩 추가하세요.  SCS4200: { label: "CAT 단말기", terms: ["CAT 단말기", "캣 단말기"] }
};

/* 너무 흔해서 검색을 흐리는 단어: 점수 비중을 낮춥니다. */
const WEAK_WORDS = new Set(["연동", "사용", "확인", "관련", "안내", "방법"]);
const STOPWORDS = new Set([
  "어떻게", "방법", "무엇", "뭐", "뭔가요", "알려주세요", "알려줘", "좀", "그리고", "하는", "해야",
  "하나요", "있나요", "있어요", "되나요", "됩니다", "어디", "언제", "문의", "관련", "대해", "대한",
  "경우", "때문", "어떤", "해주세요", "주세요", "궁금", "합니다", "어떡해", "싶어요", "싶은데",
  "하려면", "하면", "되는", "되요", "돼요", "안돼요", "안되요", "있는", "없는", "는데", "하는데",
  "가능한", "가능한가요", "뽑고", "뽑는", "뽑아"
]);
const ENDINGS = ["입니다", "인가요", "이에요", "예요", "나요", "가요", "어요", "아요", "해요", "하는", "하고",
  "에서", "에게", "으로", "이랑", "까지", "부터", "처럼", "보다", "은", "는", "이", "가", "을", "를",
  "에", "의", "로", "도", "만", "과", "와", "요", "죠"].sort((a, b) => b.length - a.length);

const compact = (s) => String(s == null ? "" : s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
const MODEL_RE = /[A-Za-z]{1,4}-[A-Za-z]?\d{2,5}[A-Za-z]?/g;
const QUERY_MODEL_RE = /[A-Z]{0,4}-?[A-Z]?\d{3,5}[A-Z]?/g;

function stem(w) {
  for (const e of ENDINGS) if (w.length - e.length >= 2 && w.endsWith(e)) return w.slice(0, -e.length);
  return w;
}

/* FAQ 목록을 검색용으로 가공 */
function prepare(rows) {
  const vocab = new Map(); // 모델 키(예: KCPC3100) -> 표시 이름(KCP-C3100)
  const items = rows.map((r, idx) => {
    const models = Array.isArray(r.models) ? r.models : [];
    const named = models.filter((m) => m && m !== "전체");
    const keys = new Set();
    const addModel = (label) => {
      const key = label.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (key.length < 3 || !/\d/.test(key)) return;   // 숫자가 없는 값(예: "Npay Connect")은 모델명이 아니라 분류 표시이므로 제외
      keys.add(key);
      if (!vocab.has(key)) vocab.set(key, label.toUpperCase());
    };
    named.forEach(addModel);
    ((r.question || "").match(MODEL_RE) || []).forEach(addModel);
    const imp = ((r.importance || "").match(/⭐/g) || []).length || 1;
    return {
      idx, raw: r,
      question: r.question || "", answer: r.answer || "",
      category: r.category || "", type: r.type || "",
      keywords: r.keywords || "", freq: Number(r.freq) || 0, imp,
      models: named, modelKeys: keys,
      general: models.includes("전체") || keys.size === 0,
      cq: compact(r.question), ck: compact(r.keywords), ca: compact(r.answer),
      cm: compact([r.category, r.type].concat(models).join(" "))
    };
  });
  return { items, vocab };
}

/* 노션 매뉴얼·표(knowledge.json)를 FAQ와 같은 모양으로 바꿔 검색에 씁니다. */
function prepareKnowledge(rows) {
  return prepare(rows.map((r) => ({
    id: r.id, question: r.title, answer: r.text, models: [], type: r.kind === "row" ? "표" : "매뉴얼",
    importance: "", category: "", keywords: "", freq: 0, updated: r.updated, kind: r.kind
  })));
}

/* A/S 표의 "제품 구분"(CAT, 멀티패드 등)에서 모델별 단말기 종류를 자동으로 만듭니다. */
function deriveAliases(kItems) {
  const out = {};
  for (const it of kItems) {
    if (it.raw.kind !== "row" || String(it.raw.id).includes("#")) continue;
    const m = /제품\s*구분\s*:\s*(.+)/.exec(it.answer);
    if (!m) continue;
    const cats = m[1].split(",").map((c) => c.trim()).filter(Boolean);
    if (!cats.length) continue;
    const terms = [];
    cats.forEach((c) => { if (/^cat$/i.test(c)) terms.push("CAT 단말기", "캣 단말기"); else terms.push(c); });
    const label = cats.join("/") + (cats.some((c) => /cat/i.test(c)) ? " 단말기" : "");
    it.modelKeys.forEach((k) => { out[k] = { label, terms }; });
  }
  return out;
}

/* 질문 → 검색 조건(모델, 키워드, 동의어 묶음)으로 해석 */
/* 모델명(vk) 안에 입력한 번호(key)가 들어 있는지: 숫자가 더 긴 숫자의 일부이면 제외 (예: 4200 은 SCS4200·KCPP4200N 에는 맞고 KCPC14200 에는 안 맞음) */
function modelMatches(vk, key) {
  let from = 0, i;
  while ((i = vk.indexOf(key, from)) !== -1) {
    const before = vk[i - 1], after = vk[i + key.length];
    const okL = !(/\d/.test(key[0]) && before && /\d/.test(before));
    const okR = !(/\d/.test(key[key.length - 1]) && after && /\d/.test(after));
    if (okL && okR) return true;
    from = i + 1;
  }
  return false;
}

function parseQuery(query, vocab) {
  const upper = String(query || "").toUpperCase();
  const matched = new Set();
  const ambiguous = [];   // 숫자만 입력해서 여러 장비에 해당하는 경우: [{ token, keys }]
  let rest = String(query || "");
  (upper.match(QUERY_MODEL_RE) || []).forEach((tok) => {
    const key = tok.replace(/[^A-Z0-9]/g, "");
    if (key.length < 4) return;
    const exact = [], part = [];
    for (const vk of vocab.keys()) {
      if (vk === key) exact.push(vk);
      else if (modelMatches(vk, key)) part.push(vk);
    }
    const hit = exact.length ? exact : part;       // 정확한 모델명을 썼으면 그것만, 번호만 썼으면 해당하는 모든 장비
    hit.forEach((vk) => matched.add(vk));
    if (!exact.length && hit.length > 1) ambiguous.push({ token: tok, keys: hit });
    if (hit.length) rest = rest.replace(new RegExp(tok.replace(/[-]/g, "\\-?"), "i"), " ");
  });

  const cq = compact(rest);
  const words = rest.replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean)
    .map((w) => w.toLowerCase()).filter((w) => !STOPWORDS.has(w)).map(stem)
    .filter((w) => w.length >= 2 && !STOPWORDS.has(w));

  const units = [];
  const groupTerms = [];
  SYNONYM_GROUPS.forEach((g) => {
    const terms = g.map(compact).filter((t) => t.length >= 2);
    if (terms.some((t) => cq.includes(t))) {
      units.push({ kind: "group", terms, label: g[0] });
      groupTerms.push(...terms);
    }
  });
  Array.from(new Set(words)).forEach((w) => {
    const cw = compact(w);
    if (cw.length < 2) return;
    if (groupTerms.some((t) => t.includes(cw) || cw.includes(t))) return;
    units.push({ kind: "token", terms: [cw], label: w, w: WEAK_WORDS.has(w) ? 0.3 : 1 });
  });
  return { matched, units, hasText: units.length > 0, ambiguous };
}

const bigrams = (s) => { const o = []; for (let i = 0; i < s.length - 1; i++) o.push(s.slice(i, i + 2)); return o; };

/* 점수 계산 */
function search(data, query, opts) {
  opts = opts || {};
  const { items, vocab } = data;
  const pq = parseQuery(query, opts.vocab || vocab);
  const modelKeys = new Set(pq.matched);
  const pickedKey = opts.model || "";
  if (pickedKey && modelKeys.size === 0) modelKeys.add(pickedKey);

  // 모델의 종류(예: CAT 단말기)도 검색 조건에 더함
  const units = pq.units.slice();
  modelKeys.forEach((k) => {
    const a = (opts.aliases || MODEL_ALIASES)[k];
    if (a) units.push({ kind: "alias", terms: a.terms.map(compact), label: a.label, w: 0.6 });
  });
  const parsed = Object.assign({}, pq, { units });

  const out = [];
  for (const it of items) {
    if (opts.category && it.category !== opts.category) continue;
    const hitModel = modelKeys.size > 0 && [...modelKeys].some((k) => it.modelKeys.has(k));
    if (pickedKey && !it.general && !it.modelKeys.has(pickedKey)) continue;

    let base = 0, hitW = 0, totalW = 0;
    for (const u of units) {
      const w = u.w || 1;
      totalW += w;
      let s = 0;
      if (u.terms.some((t) => it.ck.includes(t))) s += 6;
      if (u.terms.some((t) => it.cq.includes(t))) s += 4;
      if (u.terms.some((t) => it.cm.includes(t))) s += 2;
      if (u.terms.some((t) => it.ca.includes(t))) s += 1.5;
      if (s === 0 && u.kind === "token" && u.terms[0].length >= 3) {
        const bg = bigrams(u.terms[0]);
        const pool = it.ck + " " + it.cq;
        const ok = bg.filter((b) => pool.includes(b)).length;
        if (bg.length && ok / bg.length >= 0.6) s += 3 * (ok / bg.length);
      }
      if (s > 0) hitW += w;
      base += s * w;
    }
    if (totalW) base *= 0.4 + 0.6 * (hitW / totalW);

    if (pq.hasText) {
      if (base < 2.5) continue;
      if (modelKeys.size > 0) {
        if (hitModel) base += 5;
        else if (!it.general) base *= 0.35;
      }
    } else if (modelKeys.size > 0 && String(query || "").trim()) {
      if (!hitModel) continue;
      base = 5;
    } else if (String(query || "").trim()) {
      continue;
    } else {
      base = 1;
    }
    const score = base + Math.log1p(it.freq) * 0.4 + (it.imp - 1) * 0.2;
    out.push({ it, score });
  }
  out.sort((a, b) => b.score - a.score);
  let results = out;
  const keep = opts.minKeep == null ? 2 : opts.minKeep;
  if (pq.hasText && out.length > keep) {
    const cut = out[0].score * 0.3;   // 1위 점수의 30%에 못 미치는 결과는 잡음으로 보고 숨김 (기본 최소 2건 유지)
    results = out.filter((r, i) => i < keep || r.score >= cut);
  }
  return { results, parsed, modelKeys };
}
</script>

<script id="ui">
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MAX_SHOWN = 30;
  const INITIAL_SHOWN = 8;   // 처음에 보여 줄 FAQ 개수. 나머지는 '더 보기'로 펼침
  const MAX_DOCS = 5;
  const TOP_SHOWN = 10;

  /* ▼ 노션 원문 링크: "노션에서 원문 보기" 링크의 앞부분 주소입니다. 맨 끝은 / 로 끝나야 합니다.
       FAQ DB를 웹에 공개한 뒤 나오는 공개 주소(예: https://회사이름.notion.site/)를 넣으세요. 대리점이 로그인 없이 열 수 있어야 합니다.
       비워 두면 링크가 나오지 않습니다. */
  const NOTION_BASE = "https://south-passive-582.notion.site/";

  /* ▼ 질문 기록: 기록을 받을 주소(AI 주소와 같은 Cloudflare Worker)입니다. 비워 두면 화면에서 보내는 기록(검색 결과 없음, 찾는 답 없음)이 꺼집니다.
       AI에 보낸 질문과 답변은 Worker가 직접 기록합니다. */
  const LOG_URL = "https://faq-ai.vss-704.workers.dev";

  /* ▼ AI 요약: Cloudflare Worker 주소를 따옴표 안에 넣으면 질문할 때마다 AI 요약이 함께 나옵니다.
       비워 두거나 AI가 한도에 도달하면 자동으로 키워드 검색 결과만 보여줍니다. */
  const AI_URL = "https://faq-ai.vss-704.workers.dev";
  const AI_TIMEOUT_MS = 40000;               // AI 답변을 기다리는 최대 시간
  const AI_PAUSE_BUSY_MS = 2 * 60 * 1000;    // 요청이 몰리거나 무료 한도가 찼을 때: 이 시간 동안은 AI를 부르지 않고 검색 결과만 보여줌
  const AI_PAUSE_ERROR_MS = 30 * 1000;       // 일시 오류일 때 잠시 쉬는 시간
  const DEBUG = /[?&]debug\b/.test(location.search);   // 주소 끝에 ?debug=1 을 붙이면 AI 오류 상세를 화면에 보여줍니다
  const aiCache = new Map();

  let data = null, kdata = null, allVocab = new Map(), aliases = Object.assign({}, MODEL_ALIASES);
  let timer = null, idleTimer = null;
  let lastQuery = "", lastCount = -1, lastModelLabel = "";
  let lastRows = [], lastDocRows = [], lastAmbiguous = [], acceptedAmbiguity = "", lastModelOnly = false;
  let submitted = "", aiCtl = null, aiState = "idle", aiPausedUntil = 0;   // aiState: idle | loading | done | fallback
  const sent = new Set();
  let sentCount = 0;

  function loggable(q) {
    if (!LOG_URL || q.length < 2) return false;
    if (/@/.test(q)) return false;                               // 이메일
    if (/\d{6,}/.test(q.replace(/[\s-]/g, ""))) return false;      // 전화번호·사업자번호 등 긴 숫자
    return true;
  }

  /* 결과: "sent"(전송) / "dup"(이미 보냄) / "blocked"(기록하지 않음) */
  function logEvent(type, q, extra) {
    q = q.trim();
    if (!loggable(q) || sentCount >= 30) return "blocked";
    const key = type + "|" + q.toLowerCase();
    if (sent.has(key)) return "dup";
    sent.add(key); sentCount++;
    const payload = Object.assign({
      t: type, q: q.slice(0, 200), model: lastModelLabel, cat: "",
      dev: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "m" : "d"
    }, extra || {});
    try {
      fetch(LOG_URL, {
        method: "POST", mode: "no-cors", keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    } catch (e) { /* 기록 실패는 사용자 화면에 영향을 주지 않음 */ }
    return "sent";
  }

  function checkNoResult() {
    const q = $("q").value.trim();
    if (q && q === lastQuery && lastCount === 0) logEvent("no_result", q, { n: 0 });
  }

  /* AI 답변의 **굵게** 표시를 굵은 글씨로 바꾸고, 남는 마크다운 기호(#, `)는 지웁니다. 먼저 모두 이스케이프하므로 안전합니다. */
  function formatAi(text) {
    return esc(String(text).replace(/^#{1,6}\s*/gm, "").replace(/`/g, ""))
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^\* /gm, "- ");
  }

  /* ---------- AI 요약 (질문할 때마다 기본으로 실행, 실패하면 검색 결과만 보여줌) ---------- */
  function clearAi() {
    if (aiCtl) { aiCtl.abort(); aiCtl = null; }
    aiState = "idle";
    $("ai").innerHTML = "";
  }

  function showFallback(kind, detail) {
    aiState = "fallback";
    const msg = kind === "busy"
      ? "AI 요약 이용이 많아 지금은 검색 결과로 안내해 드립니다. 잠시 뒤 다시 질문해 주세요."
      : "지금은 AI 요약을 이용할 수 없어 검색 결과로 안내해 드립니다.";
    $("ai").innerHTML = '<p class="ai-msg">' + esc(msg + (DEBUG && detail ? " [확인용: " + detail + "]" : "")) + "</p>";
  }

  function showAnswer(d, ms) {
    aiState = "done";
    const titles = (d.sources || []).map((id) => {
      const f = data.items.find((i) => i.raw.id === id) || (kdata && kdata.items.find((i) => i.raw.id === id));
      return f ? f.question : "";
    }).filter(Boolean);
    $("ai").innerHTML = '<div class="ai-card"><h2>AI 정리 답변</h2><p class="ai-body">' + formatAi(d.answer) + '</p>' +
      '<p class="ai-note">FAQ·매뉴얼 내용을 바탕으로 AI가 정리한 답변입니다. 정확한 내용은 아래 원문으로 확인하세요.' +
      (titles.length ? '<br>근거: ' + titles.map(esc).join(" / ") : "") + '</p>' +
      (DEBUG && ms ? '<p class="ai-hint">[확인용] ' + ms + '</p>' : "") + '</div>';
  }

  function showLoading() {
    aiState = "loading";
    $("ai").innerHTML = '<div class="ai-card ai-loading" role="status"><span class="spinner" aria-hidden="true"></span><span>FAQ와 매뉴얼을 확인해 정리하는 중…</span></div>';
  }

  async function askAi(q) {
    if (!AI_URL) return;
    const ids = lastRows.slice(0, 3).concat(lastDocRows.slice(0, 4)).map((r) => r.it.raw.id).filter(Boolean);
    if (!ids.length) { clearAi(); return; }          // 근거가 될 자료가 없으면 AI를 부르지 않음
    const key = q.toLowerCase() + "|" + ids.join(",");
    if (aiCache.has(key)) { showAnswer(aiCache.get(key)); return; }
    // AI가 쉬는 중(한도 소진·오류)에는 새 답변은 만들지 않고, 서버에 저장된 답변이 있을 때만 받아 옵니다.
    const cacheOnly = Date.now() < aiPausedUntil;
    const pausedKind = aiPausedUntil - Date.now() > AI_PAUSE_ERROR_MS ? "busy" : "error";

    showLoading();
    const ctl = new AbortController();
    aiCtl = ctl;
    let timedOut = false;
    const tm = setTimeout(() => { timedOut = true; ctl.abort(); }, AI_TIMEOUT_MS);
    const t0 = Date.now();
    try {
      const res = await fetch(AI_URL, {
        method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q: q.slice(0, 200), ids, cacheOnly: cacheOnly || undefined, debug: DEBUG || undefined })
      });
      if (aiCtl !== ctl) return;                      // 그 사이 다른 질문으로 바뀜
      if (res.status === 429) {
        if (!cacheOnly) aiPausedUntil = Date.now() + AI_PAUSE_BUSY_MS;
        showFallback("busy");
        return;
      }
      if (!res.ok) {
        let det = "";
        try { det = (await res.json()).detail || ""; } catch (e2) { /* 상세 없음 */ }
        throw new Error("상태 " + res.status + (det ? ": " + det : ""));
      }
      const d = await res.json();
      if (aiCtl !== ctl) return;
      if (d.miss) { showFallback(pausedKind); return; }     // 쉬는 중인데 저장된 답변도 없음 → 검색 결과만
      if (!d.answer) throw new Error("빈 답변");
      aiCache.set(key, d);
      showAnswer(d, (d.cached ? "저장된 답변(AI 미사용), " : "") + "화면 기준 " + ((Date.now() - t0) / 1000).toFixed(1) + "초" +
        (d.ms != null ? ", 서버 AI " + (d.ms / 1000).toFixed(1) + "초" : ""));
    } catch (e) {
      if (aiCtl !== ctl) return;                      // 사용자가 다른 질문을 해서 취소된 경우는 조용히 끝냄
      if (!cacheOnly) aiPausedUntil = Date.now() + AI_PAUSE_ERROR_MS;
      showFallback(cacheOnly ? pausedKind : "error", (timedOut ? "시간 초과" : e.message) + " / " + ((Date.now() - t0) / 1000).toFixed(1) + "초");
    } finally {
      clearTimeout(tm);
      if (aiCtl === ctl) aiCtl = null;
    }
  }

  function highlight(text, terms) {
    let html = esc(text);
    const uniq = Array.from(new Set(terms.filter((t) => t && t.length >= 2))).sort((a, b) => b.length - a.length);
    uniq.forEach((t) => {
      const re = new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "ig");
      html = html.replace(re, "<mark>$1</mark>");
    });
    return html;
  }

  /* 항목의 노션 원문 주소를 만듭니다. faq.json에 url이 있으면 그것을, 없으면 id(노션 페이지 ID)로 만듭니다. */
  function notionUrl(it) {
    if (it.raw.url) return String(it.raw.url);
    if (!NOTION_BASE) return "";
    const pid = String(it.raw.id || "").split("#")[0].replace(/-/g, "");
    return /^[0-9a-f]{32}$/i.test(pid) ? NOTION_BASE + pid : "";
  }

  function sourceLink(it) {
    const u = notionUrl(it);
    return u ? '<p class="a-link"><a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">노션에서 원문 보기 ↗</a></p>' : "";
  }

  function linkify(text) {
    return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function dateOf(iso) { return iso ? String(iso).slice(0, 10) : ""; }

  function toggle(li) {
    const btn = li.querySelector(".q"), panel = li.querySelector(".a");
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      panel.hidden = expanded;
    });
    return li;
  }

  function buildItem(it, terms, open) {
    const li = document.createElement("li");
    const tags = [it.category].concat(it.models.slice(0, 3)).filter(Boolean);
    const extra = it.models.length > 3 ? '<span class="tag">외 ' + (it.models.length - 3) + '개</span>' : "";
    const id = "a" + it.idx;
    li.innerHTML =
      '<button type="button" class="q" aria-expanded="' + open + '" aria-controls="' + id + '">' +
        '<span class="q-title">' + highlight(it.question, terms) + '</span>' +
        '<span class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join("") + extra + '</span>' +
      '</button>' +
      '<div class="a" id="' + id + '"' + (open ? "" : " hidden") + '>' +
        '<p class="a-body">' + linkify(it.answer || "등록된 답변이 없습니다. 운영팀으로 문의해 주세요.") + '</p>' +
        '<p class="a-meta">' + [
          it.models.length ? "대상 단말기 " + esc(it.models.join(", ")) : "전체 단말기 공통",
          it.type ? esc(it.type) : "",
          dateOf(it.raw.updated) ? "수정 " + dateOf(it.raw.updated) : ""
        ].filter(Boolean).join(" · ") + '</p>' +
        sourceLink(it) +
      '</div>';
    return toggle(li);
  }

  function buildDoc(it, terms, open) {
    const li = document.createElement("li");
    const id = "d" + it.idx;
    const kind = it.raw.kind === "row" ? "표" : "매뉴얼";
    li.innerHTML =
      '<button type="button" class="q" aria-expanded="' + open + '" aria-controls="' + id + '">' +
        '<span class="q-title">' + highlight(it.question, terms) + '</span>' +
        '<span class="tags"><span class="tag">' + kind + '</span></span>' +
      '</button>' +
      '<div class="a" id="' + id + '"' + (open ? "" : " hidden") + '>' +
        '<p class="a-body">' + linkify(it.answer) + '</p>' +
        (dateOf(it.raw.updated) ? '<p class="a-meta">수정 ' + dateOf(it.raw.updated) + '</p>' : '') +
        sourceLink(it) +
      '</div>';
    return toggle(li);
  }

  function termsForHighlight(parsed, q) {
    const t = [];
    parsed.units.forEach((u) => u.terms.forEach((x) => t.push(x)));
    // 원문에 보이는 모델명도 강조
    (q.match(/[A-Za-z]{0,4}-?[A-Za-z]?\d{3,5}[A-Za-z]?/g) || []).forEach((m) => t.push(m));
    return t;
  }

  /* 입력한 글에서 번호(token)를 정확한 모델명으로 바꿉니다. 앞뒤가 영문·숫자로 이어진 곳은 건너뜁니다. */
  function replaceToken(text, token, label) {
    const low = text.toLowerCase(), t = token.toLowerCase();
    let from = 0, i;
    while ((i = low.indexOf(t, from)) !== -1) {
      const b = text[i - 1], a = text[i + t.length];
      if (!(b && /[A-Za-z0-9]/.test(b)) && !(a && /[A-Za-z0-9]/.test(a))) return text.slice(0, i) + label + text.slice(i + t.length);
      from = i + 1;
    }
    return (text + " " + label).trim();
  }

  /* 장비 안내 카드:
     ① 번호만 입력해서 여러 장비에 해당하면 정확한 장비를 고르게 하고,
     ② 장비만 정해졌고 질문이 아직 없으면 이어서 질문을 쓰도록 안내합니다. */
  function renderPick(q, amb, hasText, modelKeys) {
    const box = $("pick");
    box.innerHTML = ""; box.hidden = true;
    if (!q) return;
    const vlabel = (k) => allVocab.get(k) || k;

    if (!amb.length) {
      if (!hasText && modelKeys.size === 1) {
        box.hidden = false;
        box.innerHTML = '<div class="pick-note"><strong>' + esc(vlabel([...modelKeys][0])) + '</strong> 기준으로 찾고 있어요. 이어서 궁금한 내용을 입력해 주세요. (예: 영수증 재출력, 위챗페이 지원 여부)</div>';
      }
      return;
    }

    const a = amb[0];
    box.hidden = false;
    const card = document.createElement("div");
    card.className = "pick-card";
    card.innerHTML = '<p><strong>“' + esc(a.token) + '”</strong>에 해당하는 장비가 여러 개입니다. 어떤 장비인가요?</p><div class="pick-list"></div>';
    const list = card.querySelector(".pick-list");
    a.keys.slice(0, 8).forEach((k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "pick-btn";
      const kind = aliases[k] && aliases[k].label ? aliases[k].label : "";
      b.innerHTML = "<b>" + esc(vlabel(k)) + "</b>" + (kind ? "<span>" + esc(kind) + "</span>" : "");
      b.addEventListener("click", () => {
        const input = $("q");
        const next = replaceToken(input.value, a.token, vlabel(k));
        if (hasText) {                       // 질문이 이미 완성돼 있으면 장비만 바꿔서 바로 질문
          input.value = next;
          ask();
          return;
        }
        input.value = next.trim() + " ";     // 장비만 입력했으면 모델명만 채우고, 이어서 질문을 쓰게 함
        render();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });
      list.appendChild(b);
    });
    if (hasText) {                           // 질문이 있을 때만 '이대로 질문하기' 제공
      const skip = document.createElement("button");
      skip.type = "button"; skip.className = "pick-skip";
      skip.textContent = "잘 모르겠어요. 이대로 질문하기";
      skip.addEventListener("click", () => { acceptedAmbiguity = q; ask(); });
      card.appendChild(skip);
    }
    box.appendChild(card);
  }

  /* 키워드 검색 결과(FAQ + 매뉴얼·표)를 화면에 그립니다. 입력할 때마다 바로 갱신되고, AI 요약은 질문을 보낼 때만 붙습니다. */
  function render() {
    const q = $("q").value.trim();
    if (q !== submitted) { submitted = ""; clearAi(); }          // 질문이 바뀌면 이전 AI 답변은 치움

    const { results, parsed, modelKeys } = search(data, q, { vocab: allVocab, aliases });
    let docRows = [];
    if (q && kdata) {
      docRows = search(kdata, q, { vocab: allVocab, aliases, minKeep: 1 }).results;
      // 질문에 모델명이 있으면 그 모델의 표 행(종류·제조사·A/S·기능 지원)을 맨 위에 보여줌
      const detected = parseQuery(q, allVocab).matched;
      if (detected.size) {
        const modelRows = kdata.items
          .filter((it) => it.raw.kind === "row" && !String(it.raw.id).includes("#") && [...detected].some((k) => it.modelKeys.has(k)))
          .slice(0, 3).map((it) => ({ it, score: 99 }));
        const seen = new Set(modelRows.map((r) => r.it.idx));
        docRows = modelRows.concat(docRows.filter((r) => !seen.has(r.it.idx)));
      }
      docRows = docRows.slice(0, MAX_DOCS);
    }
    const docsBox = $("docs"); docsBox.innerHTML = ""; docsBox.hidden = true;
    const list = $("list"), status = $("status"), empty = $("empty");
    list.innerHTML = ""; empty.innerHTML = "";
    const fb = $("feedback"); fb.innerHTML = "";

    let rows = q ? results.slice(0, MAX_SHOWN)
      : results.slice().sort((a, b) => (b.it.freq - a.it.freq) || (b.it.imp - a.it.imp)).slice(0, TOP_SHOWN);
    lastRows = rows; lastDocRows = docRows;
    lastAmbiguous = parsed.ambiguous || [];
    lastModelOnly = !!q && !parsed.hasText && modelKeys.size > 0;
    renderPick(q, lastAmbiguous, !!parsed.hasText, modelKeys);

    lastQuery = q; lastCount = q ? results.length + docRows.length : -1;
    const vlabel = (k) => allVocab.get(k) || data.vocab.get(k) || k;
    lastModelLabel = modelKeys.size ? [...modelKeys].map(vlabel).join(", ") : "";

    if (!q) {
      status.innerHTML = "<strong>자주 찾는 FAQ</strong> 문의 빈도가 높은 순서입니다.";
    } else if (rows.length || docRows.length) {
      const cond = [];
      if (modelKeys.size) cond.push("단말기 " + [...modelKeys].map(vlabel).join(", "));
      const kw = parsed.units.map((u) => u.label);
      if (kw.length) cond.push("키워드 " + kw.join(", "));
      status.innerHTML = (rows.length ? "FAQ <strong>" + results.length + "건</strong>" : "FAQ에는 없고") +
        (docRows.length ? (rows.length ? " · " : " ") + "매뉴얼·안내 <strong>" + docRows.length + "건</strong>" : "") +
        (cond.length ? '<span class="cond">찾은 조건: ' + esc(cond.join(" / ")) + "</span>" : "");
    } else {
      status.textContent = "";
    }

    const hl = q ? termsForHighlight(parsed, q) : [];

    if (rows.length) {
      list.hidden = false;
      rows.slice(0, INITIAL_SHOWN).forEach((r, i) => list.appendChild(buildItem(r.it, hl, !!q && i === 0 && aiState === "idle")));
      if (rows.length > INITIAL_SHOWN) {
        const more = document.createElement("li");
        more.className = "more";
        const mb = document.createElement("button");
        mb.type = "button";
        mb.textContent = "나머지 " + (rows.length - INITIAL_SHOWN) + "건 더 보기";
        mb.addEventListener("click", () => {
          rows.slice(INITIAL_SHOWN).forEach((r) => list.insertBefore(buildItem(r.it, hl, false), more));
          more.remove();
        });
        more.appendChild(mb);
        list.appendChild(more);
      }
      if (q && LOG_URL) {
        fb.append("찾는 답이 아닌가요?");
        const b = document.createElement("button");
        b.type = "button"; b.textContent = "찾는 답이 없어요";
        b.addEventListener("click", () => {
          const r = logEvent("not_found", q, { n: results.length, top: rows[0].it.question });
          fb.textContent = r === "blocked"
            ? "이 검색어는 기록되지 않았습니다. 운영팀(1688-9770)으로 문의해 주세요."
            : "접수했습니다. FAQ를 보완할 때 참고하겠습니다.";
        });
        fb.appendChild(b);
      }
    } else {
      list.hidden = true;
    }

    if (docRows.length) {
      docsBox.hidden = false;
      docsBox.innerHTML = '<h2>매뉴얼·안내에서 찾은 내용</h2><p class="docs-sub">운영팀 홈의 매뉴얼과 표에서 찾았습니다.</p>';
      const dl = document.createElement("ul"); dl.className = "list";
      docRows.forEach((r, i) => dl.appendChild(buildDoc(r.it, hl, !rows.length && i === 0 && aiState === "idle")));
      docsBox.appendChild(dl);
    }

    if (q && !rows.length && !docRows.length) {
      empty.innerHTML = '<div class="notice"><p><strong>일치하는 FAQ가 없습니다.</strong></p>' +
        '<p>제품명이나 오류 문구를 짧게 줄여 다시 질문해 보세요.</p>' +
        (LOG_URL && loggable(q) ? '<p>이 질문은 FAQ를 보완하는 데 참고하도록 전달됩니다.</p>' : '') + '</div>';
    }
  }

  /* 질문 보내기: 키워드 결과를 먼저 보여주고, AI 요약을 함께 요청합니다. */
  function ask() {
    if (!data) return;
    const q = $("q").value.trim();
    if (q.length < 2) { $("q").focus(); return; }
    clearTimeout(timer);
    const same = q === submitted;
    if (!(same && (aiState === "loading" || aiState === "done"))) {
      render();
      if (lastAmbiguous.length && acceptedAmbiguity !== q) {
        // 어떤 장비인지 먼저 정해야 정확한 답변을 만들 수 있어서, 선택 카드를 보여 주고 AI는 아직 부르지 않음
        const first = document.querySelector("#pick .pick-btn");
        if (first) first.focus();
        return;
      }
      if (lastModelOnly) {                       // 장비명만 있고 질문이 없으면 AI를 부르지 않고, 이어서 입력하도록 안내
        $("q").focus();
        return;
      }
      submitted = q;
      askAi(q);
    }
    checkNoResult();
    if (window.matchMedia && matchMedia("(pointer: coarse)").matches) $("q").blur();   // 휴대폰에서는 키보드를 내려 결과가 보이게
  }

  function showError(msg) {
    $("status").textContent = "";
    $("empty").innerHTML = '<div class="notice"><p><strong>FAQ를 불러오지 못했습니다.</strong></p><p>' + esc(msg) + "</p></div>";
  }

  async function init() {
    if (!AI_URL) $("go").textContent = "검색";
    if (AI_URL || LOG_URL) $("aiNotice").hidden = false;
    try {
      const res = await fetch("public/faq.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("FAQ 파일 응답 " + res.status);
      const rows = await res.json();
      data = prepare(rows);
      allVocab = new Map(data.vocab);
    } catch (e) {
      showError("잠시 후 다시 시도해 주세요. 계속되면 운영팀(1688-9770)으로 알려 주세요.");
      return;
    }
    // 매뉴얼·표 지식은 없어도 FAQ 검색은 정상 동작하도록 따로 불러옵니다.
    try {
      const kr = await fetch("public/knowledge.json", { cache: "no-cache" });
      if (kr.ok) {
        kdata = prepareKnowledge(await kr.json());
        kdata.vocab.forEach((v, k) => { if (!allVocab.has(k)) allVocab.set(k, v); });
        aliases = Object.assign({}, MODEL_ALIASES, deriveAliases(kdata.items));
      }
    } catch (e) { kdata = null; }
    const latest = data.items.map((i) => i.raw.updated).filter(Boolean).sort().pop();
    if (latest) $("updated").textContent = "FAQ 최종 수정 " + dateOf(latest) + " · 총 " + data.items.length + "건";
    render();

    $("q").addEventListener("input", () => {
      clearTimeout(timer); timer = setTimeout(render, 150);
      clearTimeout(idleTimer); idleTimer = setTimeout(checkNoResult, 2000);   // 입력을 멈추고 2초 뒤에도 결과가 없으면 기록
    });
    $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
  }
  init();
})();
</script>
</body>
</html>
