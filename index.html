<!DOCTYPE html>
<html lang="ko">
<head>

<title>NHN KCP 단말기·전산 FAQ 검색</title>
<meta name="description" content="제품명, 오류 문구, 기능명으로 NHN KCP 단말기·전산 FAQ를 찾습니다.">
<style>
:root {
  --ink: #191919;
  --ink-2: #2E2E2E;
  --muted: #5C5C5C;
  --line: #E0E0E0;
  --line-strong: #CACACA;
  --bg: #F6F6F6;
  --surface: #FFFFFF;
  --blue: #2196F3;
  --blue-dim: #1a78c2;
  --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F2F2;
    --ink-2: #E0E0E0;
    --muted: #B5B5B5;
    --line: #3A3A3A;
    --line-strong: #555555;
    --bg: #191919;
    --surface: #242424;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }

h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
.lead { margin: 0 0 24px; color: var(--muted); font-size: 15px; }

/* 검색 */
.search { display: flex; gap: 8px; }
.search input[type="search"] {
  flex: 1; min-width: 0; height: 56px; padding: 0 18px;
  font: inherit; font-size: 17px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  -webkit-appearance: none; appearance: none;
}
.search input[type="search"]::placeholder { color: var(--muted); opacity: .8; }
.search input[type="search"]:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
.search button {
  flex: none; height: 56px; padding: 0 22px; font: inherit; font-weight: 700; font-size: 16px;
  color: #191919; background: var(--blue); border: 0; border-radius: 8px; cursor: pointer;
}
.search button:hover { background: var(--blue-dim); }
.search button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 필터 */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 16px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong);
}
.chip:hover { border-color: var(--blue); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; max-width: 200px;
}

/* 상태 줄 */

.status strong { color: var(--ink); font-weight: 700; }
.cond { display: block; margin-top: 2px; }

/* 결과 목록 */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.q {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: transparent; border: 0; padding: 16px 18px 16px 18px; cursor: pointer;

}
.q:hover { background: rgba(127,127,127,.07); }
.q:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.q[aria-expanded="true"] { border-left-color: var(--blue); }
.q-title { display: block; font-size: 16.5px; font-weight: 600; line-height: 1.5; letter-spacing: -0.005em; }
.q-title mark { background: rgba(33,150,243,.22); color: inherit; border-radius: 2px; padding: 0 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.a { padding: 0 18px 20px 21px; border-left: 3px solid var(--blue); }
.a[hidden] { display: none; }
.a-body { max-width: 68ch; margin: 0; font-size: 15.5px; line-height: 1.8; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.a-body a { color: var(--blue-dim); text-decoration: underline; text-underline-offset: 2px; }
.a-meta { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

/* 빈 결과·오류 */
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px 20px; }
.notice p { margin: 0 0 6px; }
.notice p:last-child { margin-bottom: 0; color: var(--muted); font-size: 14.5px; }
.contact { margin-top: 28px; font-size: 14px; color: var(--muted); }
.contact strong { color: var(--ink); }
.updated { margin-top: 6px; font-size: 13px; color: var(--muted); }

@media (max-width: 520px) {
  .wrap { padding: 24px 14px 56px; }
  h1 { font-size: 21px; }
  .search button { padding: 0 16px; }
  .model-pick { margin-left: 0; width: 100%; }
  .model-pick select { flex: 1; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<body>
<main class="wrap">
  <h1>NHN KCP 단말기·전산 FAQ</h1>
  <p class="lead">제품명, 오류 문구, 기능명을 말하듯이 입력하세요. 예: “C3100 영수증 다시 뽑는 법”</p>

  <p class="updated" id="updated"></p>
</main>

<script id="core">
/* =========================================================
   검색 핵심 로직 (화면과 분리되어 있음)
   ========================================================= */

/* ▼ 동의어 사전: 현장에서 쓰는 표현을 묶어 둔 곳입니다.
     같은 줄(묶음)에 있는 말은 서로 같은 뜻으로 검색됩니다.
     새 표현은 줄을 추가하거나 기존 줄에 따옴표로 단어를 더하면 됩니다. */
const SYNONYM_GROUPS = [
  ["영수증", "전표", "매출전표", "거래전표", "출력물"],
  ["재출력", "재인쇄", "다시출력", "재발행", "재프린트", "다시뽑", "재프린팅"],
  ["취소", "환불", "승인취소", "결제취소", "거래취소"],
  ["전원", "안켜", "안켜져", "켜지지", "부팅", "먹통", "꺼짐", "꺼져"],
  ["프린터", "프린트", "용지", "종이"],
  ["오류", "에러", "장애", "실패", "error"],
  ["위챗", "위챗페이", "wechat", "wechatpay", "위쳇"],
  ["토스", "토스페이", "tosspay"],
  ["네이버페이", "npay", "엔페이", "n페이", "페이센터"],
  ["개통", "개통번호", "개통확인"],
  ["비밀번호", "비번", "패스워드", "암호"],
  ["키오스크", "무인결제", "셀프결제", "무인"],
  ["집계", "마감", "일마감", "호스트집계"],
  ["한도", "고액", "보류", "매입"],
  ["해외카드", "외국카드", "해외발급", "해외"],
  ["전화승인", "ars", "수기승인"],
  ["가맹점번호", "가맹점", "mid"],
  ["설정", "세팅", "셋팅", "환경설정"],
  ["지원기종", "지원단말기", "가능단말기", "되는기계", "되는단말기", "사용가능단말기"]
];

const STOPWORDS = new Set([
  "어떻게", "방법", "무엇", "뭐", "뭔가요", "알려주세요", "알려줘", "좀", "그리고", "하는", "해야",
  "하나요", "있나요", "있어요", "되나요", "됩니다", "어디", "언제", "문의", "관련", "대해", "대한",
  "경우", "때문", "어떤", "해주세요", "주세요", "궁금", "합니다", "어떡해", "싶어요", "싶은데",
  "하려면", "하면", "되는", "되요", "돼요", "안돼요", "안되요", "있는", "없는", "는데", "하는데",
  "가능한", "가능한가요", "뽑고", "뽑는", "뽑아"
]);
const ENDINGS = ["입니다", "인가요", "이에요", "예요", "나요", "가요", "어요", "아요", "해요", "하는", "하고",
  "에서", "에게", "으로", "이랑", "까지", "부터", "처럼", "보다", "은", "는", "이", "가", "을", "를",
  "에", "의", "로", "도", "만", "과", "와", "요", "죠"].sort((a, b) => b.length - a.length);

const compact = (s) => String(s == null ? "" : s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
const MODEL_RE = /[A-Za-z]{2,4}-[A-Za-z]?\d{2,5}[A-Za-z]?/g;
const QUERY_MODEL_RE = /[A-Z]{0,4}-?[A-Z]?\d{3,5}[A-Z]?/g;

function stem(w) {
  for (const e of ENDINGS) if (w.length - e.length >= 2 && w.endsWith(e)) return w.slice(0, -e.length);
  return w;
}

/* FAQ 목록을 검색용으로 가공 */
function prepare(rows) {
  const vocab = new Map(); // 모델 키(예: KCPC3100) -> 표시 이름(KCP-C3100)
  const items = rows.map((r, idx) => {
    const models = Array.isArray(r.models) ? r.models : [];
    const named = models.filter((m) => m && m !== "전체");
    const keys = new Set();
    const addModel = (label) => {
      const key = label.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (key.length < 3) return;
      keys.add(key);
      if (!vocab.has(key)) vocab.set(key, label.toUpperCase());
    };
    named.forEach(addModel);
    ((r.question || "").match(MODEL_RE) || []).forEach(addModel);
    const imp = ((r.importance || "").match(/⭐/g) || []).length || 1;
    return {
      idx, raw: r,
      question: r.question || "", answer: r.answer || "",
      category: r.category || "", type: r.type || "",
      keywords: r.keywords || "", freq: Number(r.freq) || 0, imp,
      models: named, modelKeys: keys,
      general: models.includes("전체") || keys.size === 0,
      cq: compact(r.question), ck: compact(r.keywords), ca: compact(r.answer),
      cm: compact([r.category, r.type].concat(models).join(" "))
    };
  });
  return { items, vocab };
}

/* 질문 → 검색 조건(모델, 키워드, 동의어 묶음)으로 해석 */
function parseQuery(query, vocab) {
  const upper = String(query || "").toUpperCase();
  const matched = new Set();
  let rest = String(query || "");
  (upper.match(QUERY_MODEL_RE) || []).forEach((tok) => {
    const key = tok.replace(/[^A-Z0-9]/g, "");
    if (key.length < 4) return;
    let hit = false;
    for (const vk of vocab.keys()) {
      if (vk === key || vk.endsWith(key)) { matched.add(vk); hit = true; }
    }
    if (hit) rest = rest.replace(new RegExp(tok.replace(/[-]/g, "\\-?"), "i"), " ");
  });

  const cq = compact(rest);
  const words = rest.replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean)
    .map((w) => w.toLowerCase()).filter((w) => !STOPWORDS.has(w)).map(stem)
    .filter((w) => w.length >= 2 && !STOPWORDS.has(w));

  const units = [];
  const groupTerms = [];
  SYNONYM_GROUPS.forEach((g) => {
    const terms = g.map(compact).filter((t) => t.length >= 2);
    if (terms.some((t) => cq.includes(t))) {
      units.push({ kind: "group", terms, label: g[0] });
      groupTerms.push(...terms);
    }
  });
  Array.from(new Set(words)).forEach((w) => {
    const cw = compact(w);
    if (cw.length < 2) return;
    if (groupTerms.some((t) => t.includes(cw) || cw.includes(t))) return;
    units.push({ kind: "token", terms: [cw], label: w });
  });
  return { matched, units, hasText: units.length > 0 };
}

const bigrams = (s) => { const o = []; for (let i = 0; i < s.length - 1; i++) o.push(s.slice(i, i + 2)); return o; };

/* 점수 계산 */
function search(data, query, opts) {
  opts = opts || {};
  const { items, vocab } = data;
  const pq = parseQuery(query, vocab);
  const modelKeys = new Set(pq.matched);
  const pickedKey = opts.model || "";
  if (pickedKey && modelKeys.size === 0) modelKeys.add(pickedKey);

  const out = [];
  for (const it of items) {
    if (opts.category && it.category !== opts.category) continue;
    const hitModel = modelKeys.size > 0 && [...modelKeys].some((k) => it.modelKeys.has(k));
    if (pickedKey && !it.general && !it.modelKeys.has(pickedKey)) continue;

    let base = 0, hits = 0;
    for (const u of pq.units) {
      let s = 0;
      if (u.terms.some((t) => it.ck.includes(t))) s += 6;
      if (u.terms.some((t) => it.cq.includes(t))) s += 4;
      if (u.terms.some((t) => it.cm.includes(t))) s += 2;
      if (u.terms.some((t) => it.ca.includes(t))) s += 1.5;
      if (s === 0 && u.kind === "token" && u.terms[0].length >= 3) {
        const bg = bigrams(u.terms[0]);
        const pool = it.ck + " " + it.cq;
        const ok = bg.filter((b) => pool.includes(b)).length;
        if (bg.length && ok / bg.length >= 0.6) s += 3 * (ok / bg.length);
      }
      if (s > 0) hits++;
      base += s;
    }
    if (pq.units.length) base *= 0.4 + 0.6 * (hits / pq.units.length);

    if (pq.hasText) {
      if (base < 2.5) continue;
      if (modelKeys.size > 0) {
        if (hitModel) base += 5;
        else if (!it.general) base *= 0.35;
      }
    } else if (modelKeys.size > 0 && String(query || "").trim()) {
      if (!hitModel) continue;
      base = 5;
    } else if (String(query || "").trim()) {
      continue;
    } else {
      base = 1;
    }
    const score = base + Math.log1p(it.freq) * 0.4 + (it.imp - 1) * 0.2;
    out.push({ it, score });
  }
  out.sort((a, b) => b.score - a.score);
  return { results: out, parsed: pq, modelKeys };
}
</script>

<script id="ui">
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MAX_SHOWN = 30;
  const TOP_SHOWN = 10;

  let data = null, category = "", modelKey = "", timer = null;

  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장소를 못 써도 동작에는 지장 없음 */ } }
  };

  function highlight(text, terms) {
    let html = esc(text);
    const uniq = Array.from(new Set(terms.filter((t) => t && t.length >= 2))).sort((a, b) => b.length - a.length);
    uniq.forEach((t) => {
      const re = new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "ig");
      html = html.replace(re, "<mark>$1</mark>");
    });
    return html;
  }

  function linkify(text) {
    return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function dateOf(iso) { return iso ? String(iso).slice(0, 10) : ""; }

  function buildItem(it, terms, open) {
    const li = document.createElement("li");
    const tags = [it.category].concat(it.models.slice(0, 3)).filter(Boolean);
    const extra = it.models.length > 3 ? '<span class="tag">외 ' + (it.models.length - 3) + '개</span>' : "";
    const id = "a" + it.idx;
    li.innerHTML =
      '<button type="button" class="q" aria-expanded="' + open + '" aria-controls="' + id + '">' +
        '<span class="q-title">' + highlight(it.question, terms) + '</span>' +
        '<span class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join("") + extra + '</span>' +
      '</button>' +
      '<div class="a" id="' + id + '"' + (open ? "" : " hidden") + '>' +
        '<p class="a-body">' + linkify(it.answer || "등록된 답변이 없습니다. 운영팀으로 문의해 주세요.") + '</p>' +
        '<p class="a-meta">' + [
          it.models.length ? "대상 단말기 " + esc(it.models.join(", ")) : "전체 단말기 공통",
          it.type ? esc(it.type) : "",
          dateOf(it.raw.updated) ? "수정 " + dateOf(it.raw.updated) : ""
        ].filter(Boolean).join(" · ") + '</p>' +
      '</div>';
    const btn = li.querySelector(".q"), panel = li.querySelector(".a");
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      panel.hidden = expanded;
    });
    return li;
  }

  function render() {
    const q = $("q").value.trim();
    const { results, parsed, modelKeys } = search(data, q, { category, model: modelKey });
    const list = $("list"), status = $("status"), empty = $("empty");
    list.innerHTML = ""; empty.innerHTML = "";

    let rows = results;
    if (!q) {
      rows = results.slice().sort((a, b) => (b.it.freq - a.it.freq) || (b.it.imp - a.it.imp)).slice(0, TOP_SHOWN);
    } else {
      rows = results.slice(0, MAX_SHOWN);
    }

    const terms = [];
    parsed.units.forEach((u) => u.terms.forEach((t) => terms.push(t)));

    if (!q) {
      status.innerHTML = "<strong>자주 찾는 FAQ</strong> 문의 빈도가 높은 순서입니다.";
    } else if (rows.length) {
      const cond = [];
      if (modelKeys.size) cond.push("단말기 " + [...modelKeys].map((k) => data.vocab.get(k) || k).join(", "));
      const kw = parsed.units.map((u) => u.label);
      if (kw.length) cond.push("키워드 " + kw.join(", "));
      status.innerHTML = "검색 결과 <strong>" + results.length + "건</strong>" +
        (cond.length ? '<span class="cond">찾은 조건: ' + esc(cond.join(" / ")) + "</span>" : "");
    } else {
      status.textContent = "";
    }

    if (rows.length) {
      list.hidden = false;
      rows.forEach((r, i) => list.appendChild(buildItem(r.it, q ? termsForHighlight(parsed, q) : [], !!q && i === 0)));
    } else {
      list.hidden = true;
      empty.innerHTML = '<div class="notice"><p><strong>일치하는 FAQ가 없습니다.</strong></p>' +
        '<p>제품명이나 오류 문구를 짧게 줄여 다시 검색해 보세요. 분류나 단말기 선택을 “전체”로 바꾸면 더 넓게 찾습니다.</p></div>';
    }
  }

  function termsForHighlight(parsed, q) {
    const t = [];
    parsed.units.forEach((u) => u.terms.forEach((x) => t.push(x)));
    // 원문에 보이는 모델명도 강조
    (q.match(/[A-Za-z]{0,4}-?[A-Za-z]?\d{3,5}[A-Za-z]?/g) || []).forEach((m) => t.push(m));
    return t;
  }

  function buildFilters() {
    const cats = Array.from(new Set(data.items.map((i) => i.category).filter(Boolean)));
    const wrap = $("chips");
    const all = ["", ...cats];
    all.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c || "전체 분류";
      b.setAttribute("aria-pressed", String(c === category));
      b.addEventListener("click", () => {
        category = c;
        wrap.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        render();
      });
      wrap.appendChild(b);
    });

    const sel = $("model");
    Array.from(data.vocab.entries()).sort((a, b) => a[1].localeCompare(b[1])).forEach(([key, label]) => {
      const o = document.createElement("option");
      o.value = key; o.textContent = label; sel.appendChild(o);
    });
    const saved = store.get("faq-model");
    if (saved && data.vocab.has(saved)) { sel.value = saved; modelKey = saved; }
    sel.addEventListener("change", () => { modelKey = sel.value; store.set("faq-model", modelKey); render(); });
  }

  function showError(msg) {
    $("status").textContent = "";
    $("empty").innerHTML = '<div class="notice"><p><strong>FAQ를 불러오지 못했습니다.</strong></p><p>' + esc(msg) + "</p></div>";
  }

  async function init() {
    try {
      const res = await fetch("public/faq.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("FAQ 파일 응답 " + res.status);
      const rows = await res.json();
      data = prepare(rows);
    } catch (e) {
      showError("잠시 후 다시 시도해 주세요. 계속되면 운영팀(1688-9770)으로 알려 주세요.");
      return;
    }
    const latest = data.items.map((i) => i.raw.updated).filter(Boolean).sort().pop();
    if (latest) $("updated").textContent = "FAQ 최종 수정 " + dateOf(latest) + " · 총 " + data.items.length + "건";
    buildFilters();
    render();

    $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 120); });
    $("form").addEventListener("submit", (e) => { e.preventDefault(); render(); $("q").blur(); });
  }
  init();
})();
</script>
</body>
</html>
