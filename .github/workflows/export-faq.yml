name: Export FAQ
on: { schedule: [{ cron: "0 0,6 * * *" }], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/export-faq.mjs
        env: { NOTION_TOKEN: "${{ secrets.NOTION_TOKEN }}", NOTION_DB_ID: "${{ secrets.NOTION_DB_ID }}" }
      - run: git config user.name faq-bot && git config user.email faq-bot@users.noreply.github.com && git add public/faq.json && (git diff --staged --quiet || (git commit -m "update faq" && git push))
